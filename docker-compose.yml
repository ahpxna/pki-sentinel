name: ${COMPOSE_PROJECT_NAME:-pki-sentinel}

networks:
  pki-sentinel:
    driver: bridge

services:
  # Demo stand-in for a cloud KMS. Holds a transit key used to auto-unseal the
  # primary Vault. In production this would be AWS/GCP/Azure KMS or an HSM —
  # see docs/adr/0002-auto-unseal-tradeoffs.md.
  vault-seal:
    image: ${VAULT_IMAGE}
    container_name: pki-vault-seal
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_SEAL_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports: ["${VAULT_SEAL_PORT}:8200"]
    networks: [pki-sentinel]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  vault:
    image: ${VAULT_IMAGE}
    container_name: pki-vault
    cap_add: ["IPC_LOCK"]
    command: server -config=/vault/config/vault.hcl
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      # Transit auto-unseal client token for vault-seal. Vault's transit seal
      # stanza reads this from VAULT_TOKEN when no `token` field is set in
      # the seal config (verified against `vault server -help` and container
      # logs — see docs/adr/0002-auto-unseal-tradeoffs.md for the writeup).
      VAULT_TOKEN: ${VAULT_SEAL_TOKEN}
    ports: ["${VAULT_PORT}:8200"]
    networks: [pki-sentinel]
    volumes:
      - ./config/vault:/vault/config:ro
      - ./.data/vault:/vault/data
    depends_on:
      vault-seal:
        condition: service_healthy
    healthcheck:
      # Must tolerate "sealed"/"uninitialized" states before bootstrap runs.
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: pki-traefik
    networks:
      pki-sentinel:
        # api.internal / probe.internal must resolve inside the Docker network
        # so Vault's ACME server can reach the tls-alpn-01 challenge responder
        # (Traefik) by SNI hostname. Verify with:
        #   docker compose exec vault getent hosts api.internal
        aliases:
          - api.internal
          - probe.internal
    ports:
      - "${TRAEFIK_HTTP_PORT}:80"
      - "${TRAEFIK_HTTPS_PORT}:443"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./.data/traefik/acme:/acme
      - ./.data/traefik/logs:/var/log/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  demo-api:
    image: ${COMPOSE_PROJECT_NAME:-pki-sentinel}/demo-api:local
    build:
      context: ./services/demo-api
    container_name: pki-demo-api
    networks: [pki-sentinel]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_APPROLE_ENV_FILE: /run/secrets/demo-api.env
      DEMO_API_LISTEN: ":8000"
    volumes:
      - ./.data/approle/demo-api.env:/run/secrets/demo-api.env:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.demo-api.rule=Host(`api.internal`)
      - traefik.http.routers.demo-api.entrypoints=websecure
      - traefik.http.routers.demo-api.tls.certresolver=internal
      - traefik.http.services.demo-api.loadbalancer.server.port=8000
    depends_on:
      vault:
        condition: service_healthy
