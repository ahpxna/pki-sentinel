name: ${COMPOSE_PROJECT_NAME:-pki-sentinel}

networks:
  pki-sentinel:
    name: ${COMPOSE_PROJECT_NAME:-pki-sentinel}
    driver: bridge

x-profile-executor: &profile-executor
  image: ${COMPOSE_PROJECT_NAME:-pki-sentinel}/revocation-probe:local
  build:
    context: ./services/revocation-probe
  profiles: ["app"]
  networks: [pki-sentinel]
  entrypoint: ["probe"]
  env_file:
    - path: ./.data/executor.env
      required: false
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8120/healthz"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  # The probe runs as an explicit non-root runtime UID/GID aligned by `make env`
  # with the invoking host user. Docker can create absent bind-mount directories
  # as root, so normalize durable evidence ownership before writers start.
  evidence-init:
    image: ${COMPOSE_PROJECT_NAME:-pki-sentinel}/revocation-probe:local
    build:
      context: ./services/revocation-probe
    container_name: pki-evidence-init
    profiles: ["app", "chaos"]
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      PROBE_RUNTIME_UID: ${PROBE_RUNTIME_UID:-10001}
      PROBE_RUNTIME_GID: ${PROBE_RUNTIME_GID:-10001}
    command: ["mkdir -p /evidence && chown -R $${PROBE_RUNTIME_UID}:$${PROBE_RUNTIME_GID} /evidence && chmod 0700 /evidence"]
    volumes:
      - ./.data/evidence:/evidence
    restart: "no"

  # Root-only teardown helper for bind-mounted state created by services that
  # intentionally run under different container UIDs (Vault, probe, etc.). It
  # is never started by normal profiles; `make clean` invokes it explicitly.
  state-cleaner:
    image: ${VAULT_IMAGE}
    profiles: ["tools"]
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command: ["rm -rf /data/* /data/.[!.]* /data/..?*"]
    volumes:
      - ./.data:/data
    restart: "no"

  attestation-init:
    image: ${COMPOSE_PROJECT_NAME:-pki-sentinel}/revocation-probe:local
    build:
      context: ./services/revocation-probe
    container_name: pki-attestation-init
    profiles: ["app"]
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      PROBE_RUNTIME_UID: ${PROBE_RUNTIME_UID:-10001}
      PROBE_RUNTIME_GID: ${PROBE_RUNTIME_GID:-10001}
    command: ["mkdir -p /attestation && chown -R $${PROBE_RUNTIME_UID}:$${PROBE_RUNTIME_GID} /attestation && chmod 0700 /attestation"]
    volumes:
      - ./.data/attestation:/attestation
    restart: "no"

  # Demo stand-in for a cloud KMS. Holds a transit key used to auto-unseal the
  # primary Vault. In production this would be AWS/GCP/Azure KMS or an HSM —
  # see docs/adr/0002-auto-unseal-tradeoffs.md.
  vault-seal:
    image: ${VAULT_IMAGE}
    container_name: pki-vault-seal
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_SEAL_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    networks: [pki-sentinel]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot dependency gate: the primary Vault cannot even parse its transit
  # seal stanza until this mount and key exist. Keeping this in Compose makes
  # `docker compose up` work from a completely empty .data directory.
  vault-seal-init:
    image: ${VAULT_IMAGE}
    container_name: pki-vault-seal-init
    networks: [pki-sentinel]
    environment:
      VAULT_ADDR: http://vault-seal:8200
      VAULT_TOKEN: ${VAULT_SEAL_TOKEN}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        vault secrets enable transit >/dev/null 2>&1 || true
        vault write -f transit/keys/autounseal >/dev/null
        vault policy write pki-sentinel-autounseal - <<'POLICY'
        path "transit/encrypt/autounseal" {
          capabilities = ["update"]
        }

        path "transit/decrypt/autounseal" {
          capabilities = ["update"]
        }
        POLICY
        if [ -s /run/vault-seal/transit-token ] && \
          VAULT_TOKEN="$(cat /run/vault-seal/transit-token)" vault token lookup >/dev/null 2>&1; then
          exit 0
        fi
        umask 077
        vault token create -orphan -policy=pki-sentinel-autounseal -period=24h \
          -field=token > /run/vault-seal/transit-token
        chmod 0400 /run/vault-seal/transit-token
    volumes:
      - ./.data/vault-seal:/run/vault-seal
    depends_on:
      vault-seal:
        condition: service_healthy
    restart: "no"

  # Normalize bind-mount ownership before Vault drops privileges to its
  # packaged vault user (UID 100, GID 1000). Linux creates missing bind-mount
  # directories as root; without this gate Raft cannot create vault.db.
  vault-storage-init:
    image: ${VAULT_IMAGE}
    container_name: pki-vault-storage-init
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 100:1000 /vault/data /vault/logs"]
    volumes:
      - ./.data/vault:/vault/data
      - ./.data/vault-logs:/vault/logs
    restart: "no"

  vault:
    image: ${VAULT_IMAGE}
    container_name: pki-vault
    cap_add: ["IPC_LOCK"]
    # The root token for vault-seal is never injected into this container.
    # Read a dedicated transit-only token before the official entrypoint drops
    # privileges; it supplies the default configuration directory itself.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export VAULT_TOKEN="$(cat /run/vault-seal/transit-token)"
        exec /usr/local/bin/docker-entrypoint.sh vault server -config=/vault/config/vault.hcl
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${VAULT_PORT}:8200"]
    networks: [pki-sentinel]
    volumes:
      - ./config/vault:/vault/config:ro
      - ./.data/vault:/vault/data
      - ./.data/vault-logs:/vault/logs
      - ./.data/vault-seal:/run/vault-seal:ro
    depends_on:
      vault-seal:
        condition: service_healthy
      vault-seal-init:
        condition: service_completed_successfully
      vault-storage-init:
        condition: service_completed_successfully
    healthcheck:
      # Must tolerate "sealed"/"uninitialized" states before bootstrap runs.
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: pki-traefik
    networks:
      pki-sentinel:
        # api.internal / probe.internal must resolve inside the Docker network
        # so Vault's ACME server can reach the tls-alpn-01 challenge responder
        # (Traefik) by SNI hostname. Verify with:
        #   docker compose exec vault getent hosts api.internal
        aliases:
          - api.internal
          - probe.internal
          - vault-acme.internal
    ports:
      - "${TRAEFIK_HTTP_PORT}:80"
      - "${TRAEFIK_HTTPS_PORT}:443"
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./.data/traefik/acme:/acme
      - ./.data/traefik/logs:/var/log/traefik
      - ./.data/traefik/bootstrap:/etc/traefik/bootstrap:ro
    environment:
      LEGO_CA_CERTIFICATES: /etc/traefik/bootstrap/vault-acme.crt
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  demo-api:
    image: ${COMPOSE_PROJECT_NAME:-pki-sentinel}/demo-api:local
    build:
      context: ./services/demo-api
    container_name: pki-demo-api
    profiles: ["app"]
    networks: [pki-sentinel]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_APPROLE_ENV_FILE: /run/secrets/demo-api.env
      DEMO_API_LISTEN: ":8000"
    volumes:
      - ./.data/approle/demo-api.env:/run/secrets/demo-api.env:ro
    depends_on:
      vault:
        condition: service_healthy

  revocation-probe:
    image: ${COMPOSE_PROJECT_NAME:-pki-sentinel}/revocation-probe:local
    user: "${PROBE_RUNTIME_UID:-10001}:${PROBE_RUNTIME_GID:-10001}"
    build:
      context: ./services/revocation-probe
    container_name: pki-revocation-probe
    profiles: ["app"]
    networks: [pki-sentinel]
    environment:
      VAULT_ADDR: http://vault:8200
      # The probe runs inside Compose, so localhost would point back to the
      # probe container rather than Vault.
      VAULT_PUBLIC_ADDR: http://vault:8200
      PKI_DOMAIN: ${PKI_DOMAIN}
      # Each profile is executed through its own network-isolated container.
      # The canary binds only on the Compose bridge and is never host-published.
      PROBE_CANARY_BIND_HOST: 0.0.0.0
      PROBE_CANARY_CONNECT_HOST: revocation-probe
      PROBE_EXECUTORS: openssl-ocsp-direct=http://profile-openssl:8120,crl-check=http://profile-crl:8120,curl-cert-status=http://profile-curl-cert-status:8120,curl-default=http://profile-curl-default:8120,go-tls-default=http://profile-go-default:8120,go-hardfail-ocsp=http://profile-go-hardfail:8120,python-requests=http://profile-python:8120
      EVIDENCE_DIR: /var/lib/pki-sentinel/evidence
    env_file:
      - path: ./.data/approle/revocation-probe.env
        required: false
      - path: ./.data/executor.env
        required: false
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${PROBE_METRICS_PORT}:9110"]
    volumes:
      - ./docs/benchmarks/data:/etc/pki-sentinel/docs/benchmarks/data
      - ./.data/attestation:/run/attestation
      - ./.data/evidence:/var/lib/pki-sentinel/evidence
    restart: unless-stopped
    depends_on:
      evidence-init:
        condition: service_completed_successfully
      attestation-init:
        condition: service_completed_successfully
      vault:
        condition: service_healthy
      profile-openssl:
        condition: service_healthy
      profile-crl:
        condition: service_healthy
      profile-curl-cert-status:
        condition: service_healthy
      profile-curl-default:
        condition: service_healthy
      profile-go-default:
        condition: service_healthy
      profile-go-hardfail:
        condition: service_healthy
      profile-python:
        condition: service_healthy

  profile-openssl:
    <<: *profile-executor
    container_name: pki-profile-openssl
    environment: {EXECUTOR_ID: profile-openssl, EXECUTOR_ALLOWED_CONNECT_HOST: revocation-probe, EXECUTOR_ALLOWED_STATUS_HOST: vault}
    command: ["executor", "--profile", "openssl-ocsp-direct"]

  profile-crl:
    <<: *profile-executor
    container_name: pki-profile-crl
    environment: {EXECUTOR_ID: profile-crl, EXECUTOR_ALLOWED_CONNECT_HOST: revocation-probe, EXECUTOR_ALLOWED_STATUS_HOST: vault}
    command: ["executor", "--profile", "crl-check"]

  profile-curl-cert-status:
    <<: *profile-executor
    container_name: pki-profile-curl-cert-status
    environment: {EXECUTOR_ID: profile-curl-cert-status, EXECUTOR_ALLOWED_CONNECT_HOST: revocation-probe, EXECUTOR_ALLOWED_STATUS_HOST: vault}
    command: ["executor", "--profile", "curl-cert-status"]

  profile-curl-default:
    <<: *profile-executor
    container_name: pki-profile-curl-default
    environment: {EXECUTOR_ID: profile-curl-default, EXECUTOR_ALLOWED_CONNECT_HOST: revocation-probe, EXECUTOR_ALLOWED_STATUS_HOST: vault}
    command: ["executor", "--profile", "curl-default"]

  profile-go-default:
    <<: *profile-executor
    container_name: pki-profile-go-default
    environment: {EXECUTOR_ID: profile-go-default, EXECUTOR_ALLOWED_CONNECT_HOST: revocation-probe, EXECUTOR_ALLOWED_STATUS_HOST: vault}
    command: ["executor", "--profile", "go-tls-default"]

  profile-go-hardfail:
    <<: *profile-executor
    container_name: pki-profile-go-hardfail
    environment: {EXECUTOR_ID: profile-go-hardfail, EXECUTOR_ALLOWED_CONNECT_HOST: revocation-probe, EXECUTOR_ALLOWED_STATUS_HOST: vault}
    command: ["executor", "--profile", "go-hardfail-ocsp"]

  profile-python:
    <<: *profile-executor
    container_name: pki-profile-python
    environment: {EXECUTOR_ID: profile-python, EXECUTOR_ALLOWED_CONNECT_HOST: revocation-probe, EXECUTOR_ALLOWED_STATUS_HOST: vault}
    command: ["executor", "--profile", "python-requests"]

  # One-shot fault runner. Its loopback reverse proxy delays only the OCSP
  # responder path; no Linux network capability is required.
  chaos-runner:
    image: ${COMPOSE_PROJECT_NAME:-pki-sentinel}/revocation-probe:local
    user: "${PROBE_RUNTIME_UID:-10001}:${PROBE_RUNTIME_GID:-10001}"
    build:
      context: ./services/revocation-probe
    container_name: pki-chaos-runner
    profiles: ["chaos"]
    networks: [pki-sentinel]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_PUBLIC_ADDR: http://vault:8200
      PKI_DOMAIN: ${PKI_DOMAIN}
      EVIDENCE_DIR: /var/lib/pki-sentinel/evidence
    env_file:
      - path: ./.data/approle/revocation-probe.env
        required: false
    volumes:
      - ./docs/benchmarks/data:/etc/pki-sentinel/docs/benchmarks/data
      - ./.data/evidence:/var/lib/pki-sentinel/evidence
    depends_on:
      evidence-init:
        condition: service_completed_successfully
      vault:
        condition: service_healthy

  # Not started by `up`/`up-full` — invoked ad hoc via
  # `docker compose run --rm truststore-drift-agent baseline|check ...`
  # (see `make truststore-drift-demo`), or wired into cron/CI as a gate.
  truststore-drift-agent:
    image: ${COMPOSE_PROJECT_NAME:-pki-sentinel}/truststore-drift-agent:local
    build:
      context: ./services/truststore-drift-agent
    container_name: pki-truststore-drift-agent
    profiles: ["tools"]
    networks: [pki-sentinel]
    volumes:
      - ./.data/truststore:/data
      # A dedicated, writable demo trust store — NOT the developer's real
      # host trust store — so `make truststore-drift-demo` can safely
      # install a synthetic rogue CA without touching the host. See
      # scripts/truststore-drift-demo.sh.
      - ./.data/truststore/extra-cas:/usr/local/share/ca-certificates
      - /etc/ssl/certs:/etc/ssl/certs:ro
    working_dir: /data
