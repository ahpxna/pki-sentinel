title = "pki-sentinel gitleaks config"

[extend]
useDefault = true

# 2026-08-25: Gitleaks generic-api-key false-positive in commit 62b3b25b...
# The matched text is schema documentation, not credential material. Keep this
# exception scoped to the exact rule, introducing commit, path, and prose line
# so real generic API-key findings elsewhere remain blocking.
[[allowlists]]
description = "M1 scenario-schema documentation prose false positive"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["62b3b25b45cbe65abba9b5ad43f6357bae508bdf"]
paths = ['''^docs/experiments\.md$''']
regexTarget = "line"
regexes = ['''duplicate scenarios or profile keys, duplicate/empty reason or dependency''']

# The historical value below is an intentionally invalid token used to assert
# that Vault audit events reach the Wazuh rule. Scope the exception to the
# detector, introducing commit, file, and exact test value.
[[allowlists]]
description = "Wazuh invalid-token integration-test false positive"
targetRules = ["curl-auth-header"]
condition = "AND"
commits = ["ac9c239a99e4bfa8c7889d34f327e00be8f01779"]
paths = ['''^scripts/wazuh-live-ingestion-test\.sh$''']
regexTarget = "line"
regexes = ['''pki-sentinel-invalid-wazuh-live-test''']
