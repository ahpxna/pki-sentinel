name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [demo-api, revocation-probe, truststore-drift-agent]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}:${{ github.sha }}

      - name: generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}:${{ github.ref_name }}
          format: spdx-json
          output-file: ${{ matrix.service }}-sbom.spdx.json

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: sign image (keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}@${{ steps.build.outputs.digest }}"

      - name: attest SBOM
        run: |
          cosign attest --predicate ${{ matrix.service }}-sbom.spdx.json --type spdxjson --yes \
            "ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}@${{ steps.build.outputs.digest }}"

      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: upload SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.service }}-sbom.spdx.json
          generate_release_notes: true
