name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [demo-api, revocation-probe, truststore-drift-agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}:${{ github.sha }}

      - name: generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}:${{ github.ref_name }}
          format: spdx-json
          output-file: ${{ matrix.service }}-sbom.spdx.json

      - name: install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: sign image (keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}@${{ steps.build.outputs.digest }}"

      - name: attest SBOM
        run: |
          cosign attest --predicate ${{ matrix.service }}-sbom.spdx.json --type spdxjson --yes \
            "ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}@${{ steps.build.outputs.digest }}"

      - name: attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/pki-sentinel/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: upload SBOM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ matrix.service }}-sbom.spdx.json
          generate_release_notes: true
