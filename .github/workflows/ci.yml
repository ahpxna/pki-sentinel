name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [demo-api, revocation-probe, truststore-drift-agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: gofmt
        working-directory: services/${{ matrix.service }}
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.12.2
          working-directory: services/${{ matrix.service }}

  lint-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.5"
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/
      - name: terraform validate
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: tflint
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4
      - run: tflint --chdir=terraform/bootstrap
      - name: checkov
        uses: bridgecrewio/checkov-action@30ab847c9afc9977d1e8611da1f7e03a7260b715 # v12.2915.0
        with:
          directory: terraform/

  lint-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - services/demo-api/Dockerfile
          - services/revocation-probe/Dockerfile
          - services/truststore-drift-agent/Dockerfile
          - observability/webhook-logger/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh

  lint-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml -f docker-compose.wazuh.yml config -q

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [demo-api, revocation-probe, truststore-drift-agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"
      - name: go test
        working-directory: services/${{ matrix.service }}
        run: go test ./... -race -coverprofile=coverage.out
      - name: validate scenario manifests
        if: matrix.service == 'revocation-probe'
        working-directory: services/revocation-probe
        run: go test ./internal/scenarios -run '^TestProductionManifestsValidateAndHaveStableDigests$'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"
          cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.5"
      - name: generate integration attestation key
        run: ./scripts/generate-attestation-key.sh
      - name: prepare attestation bind-mount ownership
        run: |
          # revocation-probe is pinned to UID/GID 10001:10001. Linux bind mounts
          # preserve host numeric ownership, while the generated private key is
          # intentionally 0600. Hand only this ignored CI fixture directory to
          # the non-root probe instead of weakening the private-key mode.
          sudo chown -R 10001:10001 .data/attestation
          sudo chmod 0700 .data/attestation
          sudo chmod 0600 .data/attestation/assurance.key
          sudo chmod 0644 .data/attestation/assurance.pub
      - name: start stack
        run: |
          cp .env.example .env
          ./scripts/prepare-dev-tls.sh
          source scripts/lib/wait_for.sh
          start_stack() {
            docker compose up -d --wait --wait-timeout 120
          }
          if ! start_stack; then
            docker compose ps --all
            docker compose logs --no-color
            docker compose down --remove-orphans
            if ! start_stack; then
              compose_diagnostics="$(
                docker compose ps --all
                docker compose logs --no-color --tail=80
              )"
              compose_diagnostics="${compose_diagnostics//'%'/'%25'}"
              compose_diagnostics="${compose_diagnostics//$'\r'/'%0D'}"
              compose_diagnostics="${compose_diagnostics//$'\n'/'%0A'}"
              echo "::error file=docker-compose.yml,line=1,title=Compose startup failed::${compose_diagnostics}"
              exit 1
            fi
          fi
          wait_for_http "http://localhost:8200/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204" 120
      - name: bootstrap
        run: |
          if ! ./scripts/bootstrap.sh 2>&1 | tee /tmp/bootstrap.log; then
            bootstrap_diagnostics="$(tail -n 120 /tmp/bootstrap.log)"
            bootstrap_diagnostics="${bootstrap_diagnostics//'%'/'%25'}"
            bootstrap_diagnostics="${bootstrap_diagnostics//$'\r'/'%0D'}"
            bootstrap_diagnostics="${bootstrap_diagnostics//$'\n'/'%0A'}"
            echo "::error file=terraform/bootstrap/main.tf,line=1,title=Bootstrap failed::${bootstrap_diagnostics}"
            exit 1
          fi
      - name: build probe + truststore-drift-agent binaries
        run: |
          (cd services/revocation-probe && go build -o bin/probe ./cmd/probe)
          (cd services/truststore-drift-agent && go build -o bin/truststore-drift-agent .)
      - name: run one probe cycle
        run: |
          # The image ENTRYPOINT is `probe`; docker compose run appends the
          # command below to that entrypoint, so pass only the subcommand.
          cycle_status=0
          docker compose run --rm --no-deps -T --use-aliases revocation-probe \
            run --once --output json \
              --attestation-key /run/attestation/assurance.key \
              --attestation-out /run/attestation/last-cycle.attestation.json > /tmp/cycle.json 2> /tmp/attested-cycle.stderr || cycle_status=$?
          # A failed-but-reportable cycle is still evidence. Copy its report,
          # public key, and attestation out of the Compose volume before the
          # step exits so invalid trials remain inspectable in CI artifacts.
          docker compose run --rm --no-deps -T --entrypoint cat revocation-probe /run/attestation/assurance.pub > /tmp/assurance.pub || true
          docker compose run --rm --no-deps -T --entrypoint cat revocation-probe /run/attestation/last-cycle.attestation.json > /tmp/last-cycle.attestation.json || true
          if (( cycle_status != 0 )); then
            cycle_diagnostics="$(tail -n 80 /tmp/attested-cycle.stderr)"
            cycle_diagnostics="${cycle_diagnostics//'%'/'%25'}"
            cycle_diagnostics="${cycle_diagnostics//$'\r'/'%0D'}"
            cycle_diagnostics="${cycle_diagnostics//$'\n'/'%0A'}"
            echo "::error file=services/revocation-probe/cmd/probe/main.go,line=1,title=Attested integration cycle failed::${cycle_diagnostics}"
            cat /tmp/cycle.json || true
            echo
            cat /tmp/attested-cycle.stderr
            exit "$cycle_status"
          fi
          docker compose run --rm --no-deps -T revocation-probe \
            attest verify --public-key /run/attestation/assurance.pub \
              --input /run/attestation/last-cycle.attestation.json
          cat /tmp/cycle.json
          echo
      - name: go test -tags=integration
        working-directory: tests/integration
        env:
          PROBE_REPORT: /tmp/cycle.json
          PROBE_ATTESTATION: /tmp/last-cycle.attestation.json
          PROBE_ATTESTATION_PUBLIC_KEY: /tmp/assurance.pub
        run: go test -tags=integration ./... -v
      - name: install conftest for the live Terraform-plan policy gate
        run: |
          curl -fsSLo /tmp/conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz
          echo "96fc2fbf11f0afde51256647127e6f00a64ce839a4d9a0a1aef2426c0e6f4b3f  /tmp/conftest.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          sudo install /tmp/conftest /usr/local/bin/conftest
      - name: gate the live Terraform plan with OPA
        run: |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN="$(<.data/tf-token)"
          export TF_VAR_vault_addr="$VAULT_ADDR"
          terraform -chdir=terraform/bootstrap init -input=false
          terraform -chdir=terraform/bootstrap plan -input=false -out=/tmp/pki-sentinel.tfplan
          terraform -chdir=terraform/bootstrap show -json /tmp/pki-sentinel.tfplan > /tmp/pki-sentinel-plan.json
          conftest test /tmp/pki-sentinel-plan.json --policy policy/opa/
      - name: step summary
        if: always()
        run: |
          echo '### Detection table' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cycle.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: upload logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs > artifacts/compose-logs.txt
          for file in /tmp/cycle.json /tmp/last-cycle.attestation.json /tmp/assurance.pub /tmp/attested-cycle.stderr; do
            if [[ -f "$file" ]]; then
              cp "$file" artifacts/
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: integration-failure-logs
          path: artifacts/

  wazuh-logtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cp .env.example .env
      - name: validate the revocation audit fixture
        run: |
          set -o pipefail
          if ! ./scripts/wazuh-logtest.sh 2>&1 | tee /tmp/wazuh-logtest.log; then
            wazuh_diagnostics="$(tail -n 120 /tmp/wazuh-logtest.log)"
            wazuh_diagnostics="${wazuh_diagnostics//'%'/'%25'}"
            wazuh_diagnostics="${wazuh_diagnostics//$'\r'/'%0D'}"
            wazuh_diagnostics="${wazuh_diagnostics//$'\n'/'%0A'}"
            echo "::error file=scripts/wazuh-logtest.sh,line=1,title=Wazuh fixture failed::${wazuh_diagnostics}"
            exit 1
          fi
