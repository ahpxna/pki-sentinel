name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly — catches newly disclosed CVEs in unchanged images

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: install gitleaks 8.30.0 with checksum verification
        run: |
          curl -fsSLo gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: verify detector with a deterministic synthetic credential
        run: |
          cat > /tmp/gitleaks-smoke.toml <<'EOF'
          title = "PKI Sentinel Gitleaks smoke"

          [[rules]]
          id = "pki-sentinel-ci-smoke"
          description = "deterministic detector self-test"
          regex = '''PKI_SENTINEL_SYNTHETIC_SECRET_[A-Z0-9]{32}'''
          EOF
          mkdir -p /tmp/gitleaks-smoke
          printf 'PKI_SENTINEL_SYNTHETIC_SECRET_0123456789ABCDEF0123456789ABCDEF\n' > /tmp/gitleaks-smoke/input.txt
          if gitleaks detect --config /tmp/gitleaks-smoke.toml --no-git --source /tmp/gitleaks-smoke --redact; then
            echo "gitleaks failed its deterministic detector smoke test" >&2
            exit 1
          fi
      - name: scan repository history
        run: gitleaks git --no-banner --redact --verbose .

  fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: trivy filesystem scan
        id: trivy_fs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true
      - name: show trivy filesystem findings on failure
        if: ${{ failure() && steps.trivy_fs.outcome == 'failure' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "0"
          format: table
      - uses: github/codeql-action/upload-sarif@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: demo-api
            context: services/demo-api
          - service: revocation-probe
            context: services/revocation-probe
          - service: truststore-drift-agent
            context: services/truststore-drift-agent
          - service: webhook-logger
            context: observability/webhook-logger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: build image
        run: docker build -t pki-sentinel/${{ matrix.service }}:ci ${{ matrix.context }}
      - name: trivy image scan
        id: trivy_image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: pki-sentinel/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif
          limit-severities-for-sarif: true
      - name: show trivy image findings on failure
        if: ${{ failure() && steps.trivy_image.outcome == 'failure' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: pki-sentinel/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
      - uses: github/codeql-action/upload-sarif@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif

  iac-misconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: trivy config scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: CRITICAL
          exit-code: "1"
      - name: checkov
        uses: bridgecrewio/checkov-action@30ab847c9afc9977d1e8611da1f7e03a7260b715 # v12.2915.0
        with:
          directory: terraform/
          soft_fail: false

  opa-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install conftest 0.69.0 with checksum verification
        run: |
          curl -fsSLo conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz
          echo "96fc2fbf11f0afde51256647127e6f00a64ce839a4d9a0a1aef2426c0e6f4b3f  conftest.tar.gz" | sha256sum --check --strict
          tar -xzf conftest.tar.gz conftest
          sudo install conftest /usr/local/bin/conftest
      - name: conftest policy regression tests
        run: |
          conftest test policy/opa/testdata/allowed-plan.json --policy policy/opa/
          if conftest test policy/opa/testdata/denied-plan.json --policy policy/opa/; then
            echo "expected denied-plan.json to be rejected" >&2
            exit 1
          fi

  sast-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [demo-api, revocation-probe, truststore-drift-agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          languages: go
          source-root: services/${{ matrix.service }}
      - uses: github/codeql-action/autobuild@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
      - uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
