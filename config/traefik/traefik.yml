entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  traefik:
    address: ":8080"

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  internal:
    acme:
      caServer: https://vault-acme.internal/v1/pki_int/acme/directory
      email: pki-sentinel@example.invalid
      storage: /acme/acme.json
      keyType: EC256
      tlsChallenge: {}

api:
  dashboard: true
  insecure: true

# Enables the /ping endpoint used by the container healthcheck.
ping: {}

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true

accessLog:
  format: json
  filePath: /var/log/traefik/access.log

log:
  level: INFO
  format: json
