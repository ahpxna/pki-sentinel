# Dynamic security middleware. Keeping this in the watched file-provider
# directory allows future TLS options, routers, and middleware changes to be
# applied without restarting Traefik.
http:
  routers:
    vault-acme:
      rule: Host(`vault-acme.internal`)
      entryPoints: [websecure]
      service: vault-acme
      tls: {}
  services:
    vault-acme:
      loadBalancer:
        servers:
          - url: http://vault:8200
  middlewares:
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true

tls:
  certificates:
    - certFile: /etc/traefik/bootstrap/vault-acme.crt
      keyFile: /etc/traefik/bootstrap/vault-acme.key
