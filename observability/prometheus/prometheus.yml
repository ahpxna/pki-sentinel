global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: revocation-probe
    static_configs:
      - targets: ["revocation-probe:9110"]

  - job_name: demo-api
    static_configs:
      - targets: ["demo-api:8000"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]
