# If SLACK_WEBHOOK_URL is empty, the entrypoint script (see
# docker-compose.observability.yml) points slack_api_url_file at an empty
# file and Alertmanager falls back to the webhook-logger receiver below, so
# the alert path is still demonstrably functional without a real Slack
# workspace. A broken-looking alert path on a fresh clone reads as an
# unfinished feature — this fallback exists specifically to avoid that.
route:
  receiver: webhook-logger
  group_by: ["alertname", "profile"]
  group_wait: 5m
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h
      continue: true
    - matchers:
        - severity="warning"
      receiver: warnings
      group_wait: 5m

receivers:
  - name: webhook-logger
    webhook_configs:
      - url: "http://webhook-logger:9099/alert"
        send_resolved: true

  - name: critical
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_url
        channel: "#pki-sentinel-alerts"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.runbook_url }}\n{{ end }}"
    webhook_configs:
      - url: "http://webhook-logger:9099/alert"
        send_resolved: true

  - name: warnings
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_url
        channel: "#pki-sentinel-alerts"
        send_resolved: true
    webhook_configs:
      - url: "http://webhook-logger:9099/alert"
        send_resolved: true
