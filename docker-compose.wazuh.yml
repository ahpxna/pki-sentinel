# Wazuh single-node (manager + indexer + dashboard) is heavy — roughly 4GB
# RAM. Kept behind the `wazuh` Compose profile and a separate `make
# up-wazuh` target so the default clone experience stays light.
#
# NOTE: this file wires up the manager and mounts the custom decoder/rule
# files; the indexer/dashboard images are intentionally left as commented
# guidance rather than pinned here, since a full 3-node Wazuh stack has
# its own certificate bootstrap that is out of scope for this reference
# repo. Run `make up-wazuh` after reading docs/runbooks — the manager alone
# is sufficient to exercise `wazuh-logtest` against the fixtures in
# tests/fixtures/.
networks:
  pki-sentinel:
    external: false

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    container_name: pki-wazuh-manager
    profiles: ["wazuh"]
    networks: [pki-sentinel]
    volumes:
      # Wazuh 4.8.x seeds /var/ossec/etc during container initialization. A
      # direct nested bind mount under /var/ossec/etc makes that directory look
      # pre-populated, so the image skips restoring its default ossec.conf.
      # Custom configuration must enter through the image's supported staging
      # directory and is copied into /var/ossec only after defaults are seeded.
      - ./observability/wazuh/decoders/vault_audit.xml:/wazuh-config-mount/etc/decoders/vault_audit.xml:ro
      - ./observability/wazuh/rules/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      - ./.data/vault-logs:/var/ossec/logs/vault:ro
      - ./.data/wazuh/var-ossec:/var/ossec/data
    environment:
      INDEXER_URL: ""
      FILEBEAT_SSL_VERIFICATION_MODE: none
